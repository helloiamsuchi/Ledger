<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DailyDime — Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #13161e;
    --surface2:  #1a1e2a;
    --border:    #252b3b;
    --text:      #e8eaf0;
    --muted:     #5c6278;
    --accent:    #5b8dee;
    --green:     #4ecca3;
    --red:       #e05c7a;
    --yellow:    #f5c542;
    --purple:    #9b7fe8;
    --orange:    #f0874a;
    --teal:      #3dd6c8;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-head);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .4;
  }

  /* ── LAYOUT ── */
  .app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 32px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }
  .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
  .logo span { color: var(--accent); }
  .header-month {
    font-family: var(--font-mono); font-size: .75rem; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px; letter-spacing: .08em;
  }

  /* ── SUMMARY CARDS ── */
  .summary-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    margin-bottom: 36px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    position: relative; overflow: hidden;
    transition: border-color .2s, transform .2s;
    animation: fadeUp .5s ease both;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card::after {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--glow, var(--accent)); opacity: .06; filter: blur(20px);
  }
  .card-label {
    font-family: var(--font-mono); font-size: .7rem; color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px;
  }
  .card-value {
    font-size: 2rem; font-weight: 800; letter-spacing: -.04em;
    line-height: 1;
  }
  .card-sub { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); margin-top: 8px; }
  .card.income  { --glow: var(--green); }
  .card.expense { --glow: var(--red); }
  .card.balance { --glow: var(--accent); }
  .card.income  .card-value { color: var(--green); }
  .card.expense .card-value { color: var(--red); }
  .card.balance .card-value { color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; }

  /* ── MAIN GRID ── */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    margin-bottom: 20px;
  }

  /* ── SECTION TITLES ── */
  .section-title {
    font-size: .7rem; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* ── CHART PANEL ── */
  .chart-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    animation: fadeUp .5s .25s ease both;
  }
  #barChart { width: 100%; height: 220px; }

  /* ── BUDGET PANEL ── */
  .budget-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    animation: fadeUp .5s .3s ease both;
  }
  .budget-item { margin-bottom: 20px; }
  .budget-item:last-child { margin-bottom: 0; }
  .budget-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 7px;
  }
  .budget-cat {
    display: flex; align-items: center; gap: 8px;
    font-size: .85rem; font-weight: 600;
  }
  .budget-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cat-color);
  }
  .budget-nums {
    font-family: var(--font-mono); font-size: .72rem; color: var(--muted);
  }
  .budget-bar-track {
    height: 5px; background: var(--border); border-radius: 10px; overflow: hidden;
  }
  .budget-bar-fill {
    height: 100%; border-radius: 10px;
    background: var(--cat-color);
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  .budget-bar-fill.over { background: var(--red) !important; }

  /* ── BOTTOM GRID ── */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
  }

  /* ── ADD TRANSACTION ── */
  .add-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    animation: fadeUp .5s .35s ease both;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  input, select {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-head); font-size: .9rem;
    padding: 10px 14px; border-radius: 10px; outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface2); }

  .type-toggle {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 16px;
  }
  .type-btn {
    padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: var(--font-head);
    font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .type-btn.active-income  { border-color: var(--green); color: var(--green); background: rgba(78,204,163,.08); }
  .type-btn.active-expense { border-color: var(--red);   color: var(--red);   background: rgba(224,92,122,.08); }

  .btn-add {
    width: 100%; padding: 12px; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-family: var(--font-head); font-size: .95rem; font-weight: 700;
    border: none; cursor: pointer;
    transition: opacity .2s, transform .15s;
    margin-top: 4px;
  }
  .btn-add:hover { opacity: .88; transform: translateY(-1px); }
  .btn-add:active { transform: scale(.98); }

  /* ── TRANSACTIONS LIST ── */
  .transactions-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    animation: fadeUp .5s .4s ease both;
    max-height: 420px; display: flex; flex-direction: column;
  }
  .tx-list { overflow-y: auto; flex: 1; }
  .tx-list::-webkit-scrollbar { width: 4px; }
  .tx-list::-webkit-scrollbar-track { background: transparent; }
  .tx-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    animation: fadeUp .3s ease both;
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); margin-top: 2px; }
  .tx-amount {
    font-family: var(--font-mono); font-size: .95rem; font-weight: 500;
    flex-shrink: 0;
  }
  .tx-amount.inc { color: var(--green); }
  .tx-amount.exp { color: var(--red); }
  .tx-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1rem; padding: 4px 6px; border-radius: 6px;
    transition: color .15s, background .15s; flex-shrink: 0;
  }
  .tx-del:hover { color: var(--red); background: rgba(224,92,122,.1); }

  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-family: var(--font-mono); font-size: .8rem;
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 10px; opacity: .4; }

  /* ── DONUT ── */
  #donutWrap {
    display: flex; align-items: center; justify-content: center;
    gap: 28px; margin-top: 8px;
  }
  #donutCanvas { flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-val { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); margin-left: 4px; }

  /* ── responsive ── */
  @media (max-width: 860px) {
    .main-grid, .bottom-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">led<span>ger</span></div>
    <div class="header-month" id="headerMonth"></div>
  </header>

  <!-- Summary Cards -->
  <div class="summary-grid">
    <div class="card income">
      <div class="card-label">Total Income</div>
      <div class="card-value" id="totalIncome">₹0</div>
      <div class="card-sub" id="incomeCount">0 transactions</div>
    </div>
    <div class="card expense">
      <div class="card-label">Total Expenses</div>
      <div class="card-value" id="totalExpense">₹0</div>
      <div class="card-sub" id="expenseCount">0 transactions</div>
    </div>
    <div class="card balance">
      <div class="card-label">Net Balance</div>
      <div class="card-value" id="netBalance">₹0</div>
      <div class="card-sub" id="savingsRate">—</div>
    </div>
  </div>

  <!-- Charts + Budget -->
  <div class="main-grid">
    <div class="chart-panel">
      <div class="section-title">Monthly Spending Overview</div>
      <canvas id="barChart"></canvas>
      <div style="margin-top:28px">
        <div class="section-title">Spending by Category</div>
        <div id="donutWrap">
          <canvas id="donutCanvas" width="140" height="140"></canvas>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </div>
    <div class="budget-panel">
      <div class="section-title">Budget Limits</div>
      <div id="budgetList"></div>
    </div>
  </div>

  <!-- Add + Transactions -->
  <div class="bottom-grid">
    <div class="add-panel">
      <div class="section-title">Add Transaction</div>
      <div class="type-toggle">
        <button class="type-btn active-expense" id="btnExpense" onclick="setType('expense')">↑ Expense</button>
        <button class="type-btn" id="btnIncome"  onclick="setType('income')">↓ Income</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="txDesc" placeholder="e.g. Groceries" />
        </div>
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="txAmount" placeholder="0.00" min="0" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="txCat"></select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="txDate" />
        </div>
      </div>
      <button class="btn-add" onclick="addTransaction()">+ Add Transaction</button>
    </div>

    <div class="transactions-panel">
      <div class="section-title">Recent Transactions</div>
      <div class="tx-list" id="txList"></div>
    </div>
  </div>

</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CATEGORIES = [
  { id:'food',      label:'Food & Dining',   icon:'🍜', color:'#f0874a' },
  { id:'transport', label:'Transport',        icon:'🚌', color:'#5b8dee' },
  { id:'shopping',  label:'Shopping',         icon:'🛍️', color:'#9b7fe8' },
  { id:'health',    label:'Health',           icon:'💊', color:'#e05c7a' },
  { id:'bills',     label:'Bills & Utilities',icon:'💡', color:'#f5c542' },
  { id:'entertain', label:'Entertainment',    icon:'🎬', color:'#3dd6c8' },
  { id:'income',    label:'Income',           icon:'💰', color:'#4ecca3' },
  { id:'other',     label:'Other',            icon:'📦', color:'#5c6278' },
];

const BUDGETS = { food:6000, transport:2000, shopping:4000, health:2000, bills:3000, entertain:2000 };

let txType = 'expense';
let transactions = JSON.parse(localStorage.getItem('ledger_tx') || '[]');

function save() { localStorage.setItem('ledger_tx', JSON.stringify(transactions)); }
function catById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES.at(-1); }
function fmt(n) { return '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:0, maximumFractionDigits:0}); }

// ── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // header month
  const now = new Date();
  document.getElementById('headerMonth').textContent =
    now.toLocaleString('default', { month:'long', year:'numeric' }).toUpperCase();

  // default date
  document.getElementById('txDate').value = now.toISOString().split('T')[0];

  // populate category select (expense only)
  buildCatSelect();

  render();
});

function buildCatSelect() {
  const sel = document.getElementById('txCat');
  sel.innerHTML = '';
  CATEGORIES.filter(c => txType === 'income' ? c.id === 'income' : c.id !== 'income')
    .forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.icon + ' ' + c.label;
      sel.appendChild(o);
    });
}

function setType(t) {
  txType = t;
  document.getElementById('btnExpense').className = 'type-btn' + (t==='expense' ? ' active-expense' : '');
  document.getElementById('btnIncome').className  = 'type-btn' + (t==='income'  ? ' active-income'  : '');
  buildCatSelect();
}

// ── ADD ───────────────────────────────────────────────────────────────────────
function addTransaction() {
  const desc   = document.getElementById('txDesc').value.trim();
  const amount = parseFloat(document.getElementById('txAmount').value);
  const cat    = document.getElementById('txCat').value;
  const date   = document.getElementById('txDate').value;
  if (!desc || !amount || amount <= 0 || !date) { shake(); return; }

  transactions.unshift({
    id: Date.now(), desc, amount,
    type: txType, cat, date
  });
  save(); render();

  document.getElementById('txDesc').value   = '';
  document.getElementById('txAmount').value = '';
}

function shake() {
  const btn = document.querySelector('.btn-add');
  btn.style.animation = 'none';
  btn.style.transform = 'translateX(-6px)';
  setTimeout(() => btn.style.transform = 'translateX(6px)', 80);
  setTimeout(() => btn.style.transform = '', 160);
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save(); render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderSummary();
  renderBudget();
  renderTxList();
  renderBarChart();
  renderDonut();
}

function renderSummary() {
  const income  = transactions.filter(t => t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = transactions.filter(t => t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  document.getElementById('totalIncome').textContent  = fmt(income);
  document.getElementById('totalExpense').textContent = fmt(expense);
  document.getElementById('netBalance').textContent   = fmt(balance);
  const ic = transactions.filter(t=>t.type==='income').length;
  const ec = transactions.filter(t=>t.type==='expense').length;
  document.getElementById('incomeCount').textContent  = ic + ' transaction' + (ic!==1?'s':'');
  document.getElementById('expenseCount').textContent = ec + ' transaction' + (ec!==1?'s':'');
  const rate = income > 0 ? Math.round((balance/income)*100) : 0;
  document.getElementById('savingsRate').textContent  = income > 0 ? `savings rate: ${rate}%` : '—';
}

function renderBudget() {
  const list = document.getElementById('budgetList');
  list.innerHTML = '';
  Object.entries(BUDGETS).forEach(([catId, limit]) => {
    const cat = catById(catId);
    const spent = transactions.filter(t=>t.type==='expense'&&t.cat===catId).reduce((s,t)=>s+t.amount,0);
    const pct = Math.min((spent/limit)*100, 100);
    const over = spent > limit;
    list.innerHTML += `
      <div class="budget-item">
        <div class="budget-row">
          <div class="budget-cat">
            <div class="budget-dot" style="--cat-color:${cat.color}"></div>
            ${cat.icon} ${cat.label}
          </div>
          <div class="budget-nums">${fmt(spent)} / ${fmt(limit)}</div>
        </div>
        <div class="budget-bar-track">
          <div class="budget-bar-fill ${over?'over':''}"
            style="width:${pct}%; --cat-color:${cat.color}"></div>
        </div>
      </div>`;
  });
}

function renderTxList() {
  const list = document.getElementById('txList');
  if (!transactions.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📭</div>No transactions yet.<br>Add one above!</div>`;
    return;
  }
  list.innerHTML = transactions.slice(0,30).map(t => {
    const cat = catById(t.cat);
    const d   = new Date(t.date).toLocaleDateString('en-IN', {day:'2-digit',month:'short'});
    return `
    <div class="tx-item">
      <div class="tx-icon" style="background:${cat.color}18">${cat.icon}</div>
      <div class="tx-info">
        <div class="tx-name">${t.desc}</div>
        <div class="tx-meta">${cat.label} · ${d}</div>
      </div>
      <div class="tx-amount ${t.type==='income'?'inc':'exp'}">
        ${t.type==='income'?'+':'-'}${fmt(t.amount)}
      </div>
      <button class="tx-del" onclick="deleteTransaction(${t.id})" title="Delete">✕</button>
    </div>`;
  }).join('');
}

// ── BAR CHART ─────────────────────────────────────────────────────────────────
function renderBarChart() {
  const canvas = document.getElementById('barChart');
  const ctx    = canvas.getContext('2d');
  const dpr    = window.devicePixelRatio || 1;
  const W      = canvas.offsetWidth;
  const H      = 220;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // build last 6 months data
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push({ label: d.toLocaleString('default',{month:'short'}), key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` });
  }

  const income  = months.map(m => transactions.filter(t=>t.type==='income' &&t.date.startsWith(m.key)).reduce((s,t)=>s+t.amount,0));
  const expense = months.map(m => transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m.key)).reduce((s,t)=>s+t.amount,0));
  const maxVal  = Math.max(...income, ...expense, 1);

  const pad     = { l:40, r:10, t:10, b:32 };
  const plotW   = W - pad.l - pad.r;
  const plotH   = H - pad.t - pad.b;
  const barW    = (plotW / months.length) * .28;
  const gap     = (plotW / months.length);

  // grid lines
  ctx.strokeStyle = '#252b3b'; ctx.lineWidth = 1;
  [0.25,0.5,0.75,1].forEach(f => {
    const y = pad.t + plotH - f * plotH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#5c6278'; ctx.font = `400 10px 'DM Mono', monospace`;
    ctx.textAlign = 'right';
    ctx.fillText('₹'+Math.round(maxVal*f/1000)+'k', pad.l - 6, y + 4);
  });

  // bars
  months.forEach((m, i) => {
    const cx  = pad.l + gap * i + gap / 2;
    const ih  = (income[i]  / maxVal) * plotH;
    const eh  = (expense[i] / maxVal) * plotH;

    // income bar
    const ig = ctx.createLinearGradient(0, pad.t + plotH - ih, 0, pad.t + plotH);
    ig.addColorStop(0, '#4ecca3'); ig.addColorStop(1, '#4ecca310');
    ctx.fillStyle = ig;
    roundRect(ctx, cx - barW - 3, pad.t + plotH - ih, barW, ih, 4);
    ctx.fill();

    // expense bar
    const eg = ctx.createLinearGradient(0, pad.t + plotH - eh, 0, pad.t + plotH);
    eg.addColorStop(0, '#e05c7a'); eg.addColorStop(1, '#e05c7a10');
    ctx.fillStyle = eg;
    roundRect(ctx, cx + 3, pad.t + plotH - eh, barW, eh, 4);
    ctx.fill();

    // label
    ctx.fillStyle = '#5c6278'; ctx.font = `400 10px 'DM Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(m.label, cx, H - 8);
  });

  // legend
  ctx.fillStyle = '#4ecca3'; ctx.font = `600 11px 'Syne', sans-serif`; ctx.textAlign='left';
  ctx.fillRect(pad.l, 4, 10, 10);
  ctx.fillText('Income', pad.l + 14, 13);
  ctx.fillStyle = '#e05c7a';
  ctx.fillRect(pad.l + 70, 4, 10, 10);
  ctx.fillText('Expense', pad.l + 84, 13);
}

function roundRect(ctx, x, y, w, h, r) {
  if (h <= 0) return;
  r = Math.min(r, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h); ctx.lineTo(x, y+h); ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── DONUT ─────────────────────────────────────────────────────────────────────
function renderDonut() {
  const canvas = document.getElementById('donutCanvas');
  const ctx    = canvas.getContext('2d');
  const dpr    = window.devicePixelRatio || 1;
  canvas.width  = 140 * dpr; canvas.height = 140 * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,140,140);

  const expCats = CATEGORIES.filter(c => c.id !== 'income');
  const data = expCats.map(c => ({
    ...c,
    total: transactions.filter(t=>t.type==='expense'&&t.cat===c.id).reduce((s,t)=>s+t.amount,0)
  })).filter(d => d.total > 0);

  const total = data.reduce((s,d)=>s+d.total,0);
  const cx = 70, cy = 70, r = 58, inner = 34;

  if (!total) {
    ctx.strokeStyle = '#252b3b'; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.arc(cx, cy, (r+inner)/2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#5c6278'; ctx.font = `400 9px 'DM Mono'`; ctx.textAlign='center';
    ctx.fillText('no data', cx, cy+4);
  } else {
    let start = -Math.PI / 2;
    data.forEach(d => {
      const slice = (d.total / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + slice);
      ctx.closePath();
      ctx.fillStyle = d.color; ctx.fill();
      start += slice;
    });
    // hole
    ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2);
    ctx.fillStyle = '#13161e'; ctx.fill();
    // center text
    ctx.fillStyle = '#e8eaf0'; ctx.font = `700 13px 'Syne'`; ctx.textAlign='center';
    ctx.fillText(fmt(total), cx, cy + 2);
    ctx.fillStyle = '#5c6278'; ctx.font = `400 9px 'DM Mono'`; ctx.fillText('spent', cx, cy + 15);
  }

  // legend
  const legend = document.getElementById('donutLegend');
  legend.innerHTML = data.length ? data.map(d => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${d.color}"></div>
      <span>${d.icon} ${d.label}</span>
      <span class="legend-val">${fmt(d.total)}</span>
    </div>`).join('') : `<div class="legend-val">Add expense transactions<br>to see breakdown.</div>`;
}

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => { renderBarChart(); renderDonut(); });
</script>
